server {
    listen ${PORT};
    server_name _;

    root /var/www/digarr;
    index index.html;

    # API + OIDC proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:${UVICORN_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:${UVICORN_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remote MCP endpoint (optional — only listening if DIGARR_MCP_ISSUER_URL /
    # DIGARR_MCP_PUBLIC_URL are configured; otherwise this just 502s). Proxied to
    # its own standalone process, NOT the main backend — see mcp_server/http_server.py
    # for why. Streaming (SSE-style) responses need buffering off and HTTP/1.1.
    location /mcp {
        proxy_pass http://127.0.0.1:${MCP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:${MCP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve React app - catch all for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
